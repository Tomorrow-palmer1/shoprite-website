<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>shoprite</title>
</head>

<body>
    <header class="header-container">
        <div class="upper-header">
            <marquee class="upper-header-text">
                <span class="upper-header-span">
                    Never pay more than the Shoprite prize!! questions or concerns? contact
                </span>
                support@retailsupermarkets.com
            </marquee>
        </div>
        <div class="lower-header">
            <div class="lower-header-inner">
                <img src="img/logo.png" class="logo" alt="Shoprite logo">

                <img src="img/menu.png" class="menu" alt="menu">
            </div>
        </div>
    </header>
    <section class="showcase-container">
        <img src="img/showcase.jpeg" alt="showcase Img">
    </section>
</body>

</html>
